---
- name: Configure Nginx Web Server
  hosts: webservers
  become: true
  gather_facts: true

  tasks:
    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy custom homepage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Project 15 - Ansible Automation</title>
          </head>
          <body>
              <h1>Welcome to Project 15!</h1>
              <h2>Server Configuration Automated with Ansible</h2>
              <p>Successfully deployed using Ansible over AWS Systems Manager.</p>
              <p>Managed Node: i-0714f431c4e259bff</p>
          </body>
          </html>
        owner: root
        group: root
        mode: '0644'
